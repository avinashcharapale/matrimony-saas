<ion-page>
  <ion-content>
    <ion-toolbar class="mobile-toolbar">
      <ion-title>{{ tenant.ctaLogin }}</ion-title>
    </ion-toolbar>

    <div class="form-card">
      <ion-item>
        <ion-label position="stacked">Email</ion-label>
        <ion-input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="name@example.com"
          required
          maxlength="120"
          (ionBlur)="onEmailBlur()"
        ></ion-input>
      </ion-item>
      @if (emailInvalid()) {
      <ion-text color="danger" class="field-error"><small>Please enter a valid email address.</small></ion-text>
      }

      <ion-item>
        <ion-label position="stacked">Password</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter password"
          required
          minlength="6"
          maxlength="64"
          (ionBlur)="onPasswordBlur()"
        ></ion-input>
      </ion-item>
      @if (passwordInvalid()) {
      <ion-text color="danger" class="field-error"><small>Password must be between 6 and 64 characters.</small></ion-text>
      }

      <ion-button expand="block" class="submit-button" (click)="submit()">Sign In</ion-button>
      @if (error()) {
      <p class="error-message">{{ error() }}</p>
      }

      <div class="login-links">
        <a href="#">Forgot password?</a>
        <span class="links-sep">|</span>
        <span>First time here? <a routerLink="/register">Register</a></span>
      </div>
    </div>
  </ion-content>
</ion-page>
