<ion-page>
  <ion-content>
    <div class="shell">
      <h2>{{ pageData.title }}</h2>
      <p>{{ pageData.description }}</p>

      <ul>
        @for (item of pageData.highlights; track item) {
        <li>{{ item }}</li>
        }
      </ul>

      <a routerLink="/home" class="btn">Back to Home</a>
    </div>
  </ion-content>
</ion-page>
