<section class="search-page">
  <div class="search-shell">
    <app-profile-list-sidebar
      [userName]="userName()"
      [userPhotoUrl]="userPhotoUrl()"
      [userOccupation]="userOccupation()">
    </app-profile-list-sidebar>

    <div class="search-main">
      <app-profile-list-title [userFirstName]="userFirstName()"></app-profile-list-title>
      <app-profile-list-search-panel
        [filters]="filters"
        [sortBy]="sortBy()"
        [resultsCount]="sortedResults().length"
        [error]="error()"
        [isAuthenticated]="isAuthenticated()"
        [religionOptions]="religionOptions()"
        [casteOptions]="casteOptions()"
        [educationOptions]="educationOptions()"
        [maritalStatusOptions]="maritalStatusOptions()"
        [occupationOptions]="occupationOptions()"
        (searchRequested)="search($event)"
        (sortByChange)="sortBy.set($event)"
        (religionChange)="onReligionChange()">
      </app-profile-list-search-panel>

      <app-profile-list-results
        [hasResults]="sortedResults().length > 0"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [pageNumbers]="pageNumbers()"
        [pageResults]="pageResults()"
        [getProfilePhotoUrl]="getProfilePhotoUrl.bind(this)"
        [getReligionLabel]="getReligionLabel.bind(this)"
        [getCasteLabel]="getCasteLabel.bind(this)"
        [onPhotoError]="onPhotoError.bind(this)"
        (pageChange)="goToPage($event)"
        (profileSelect)="openProfile($event)">
      </app-profile-list-results>
    </div>
  </div>
</section>
