<form class="search-panel" #searchForm="ngForm" (ngSubmit)="searchRequested.emit(searchForm)">

  @if (error) {
  <div class="form-error">{{ error }}</div>
  }

  <div class="search-primary">
    <div class="search-input-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input
        type="text"
        class="search-input"
        name="name"
        [(ngModel)]="filters['name']"
        placeholder="Search by name, city, or keyword..."
        maxlength="60"
        pattern="[A-Za-z .-]*"
      />
    </div>

    <div class="search-quick-filters">
      @if (!isAuthenticated) {
      <div class="qf-field">
        <label>Looking For</label>
        <select name="lookingForQuick" [(ngModel)]="filters['lookingFor']">
          <option value="Bride">Bride</option>
          <option value="Groom">Groom</option>
        </select>
      </div>
      }
      <div class="qf-field">
        <label>Age</label>
        <div class="age-range">
          <select name="ageMin" [(ngModel)]="filters['ageMin']">
            <option [ngValue]="18">18</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="22">22</option>
            <option [ngValue]="24">24</option>
            <option [ngValue]="26">26</option>
            <option [ngValue]="28">28</option>
            <option [ngValue]="30">30</option>
            <option [ngValue]="32">32</option>
            <option [ngValue]="34">34</option>
            <option [ngValue]="36">36</option>
            <option [ngValue]="38">38</option>
            <option [ngValue]="40">40</option>
            <option [ngValue]="42">42</option>
            <option [ngValue]="44">44</option>
            <option [ngValue]="46">46</option>
            <option [ngValue]="48">48</option>
            <option [ngValue]="50">50</option>
          </select>
          <span class="range-sep">to</span>
          <select name="ageMax" [(ngModel)]="filters['ageMax']">
            <option [ngValue]="20">20</option>
            <option [ngValue]="22">22</option>
            <option [ngValue]="24">24</option>
            <option [ngValue]="26">26</option>
            <option [ngValue]="28">28</option>
            <option [ngValue]="30">30</option>
            <option [ngValue]="32">32</option>
            <option [ngValue]="34">34</option>
            <option [ngValue]="36">36</option>
            <option [ngValue]="38">38</option>
            <option [ngValue]="40">40</option>
            <option [ngValue]="42">42</option>
            <option [ngValue]="44">44</option>
            <option [ngValue]="46">46</option>
            <option [ngValue]="48">48</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="55">55</option>
            <option [ngValue]="60">60</option>
          </select>
        </div>
      </div>
      <div class="qf-field">
        <label>City</label>
        <input type="text" name="location" [(ngModel)]="filters['location']" placeholder="Any" maxlength="60" pattern="[A-Za-z .-]*" />
      </div>
      <button type="submit" class="btn-search">Search</button>
    </div>
  </div>

  <div class="search-meta-bar">
    <button type="button" class="filter-toggle" (click)="showAdvanced = !showAdvanced" [class.active]="showAdvanced">
      <span class="toggle-arrow" [class.open]="showAdvanced">&#x25B8;</span>
      Filters
      @if (activeFilterCount > 0) {
        <span class="filter-badge">{{ activeFilterCount }}</span>
      }
    </button>

    <div class="result-summary">
      <strong>{{ resultsCount }}</strong>
      <span>matching profiles</span>
    </div>

    <label class="sort-control">
      Sort by
      <select name="sortBy" [ngModel]="sortBy" (ngModelChange)="sortByChange.emit($event)">
        <option value="relevance">Relevance</option>
        <option value="age-asc">Age: Low to High</option>
        <option value="age-desc">Age: High to Low</option>
      </select>
    </label>
  </div>

  @if (showAdvanced) {
  <div class="advanced-panel">
    <div class="adv-grid">
      <div class="adv-field">
        <label>Religion</label>
        <select name="religion" [(ngModel)]="filters['religion']" (ngModelChange)="religionChange.emit()">
          <option value="">Any</option>
          @for (opt of religionOptions; track opt.id) {
            <option [value]="opt.id">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="adv-field">
        <label>Caste</label>
        <select name="caste" [(ngModel)]="filters['caste']">
          <option value="">Any</option>
          @for (opt of casteOptions; track opt.id) {
            <option [value]="opt.id">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="adv-field">
        <label>Education</label>
        <select name="education" [(ngModel)]="filters['education']">
          <option value="">Any</option>
          @for (opt of educationOptions; track opt.id) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="adv-field">
        <label>Marital Status</label>
        <select name="maritalStatus" [(ngModel)]="filters['maritalStatus']">
          <option value="">Any</option>
          @for (opt of maritalStatusOptions; track opt.id) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="adv-field">
        <label>Occupation</label>
        <select name="occupationFilter" [(ngModel)]="filters['occupation']">
          <option value="">Any</option>
          @for (opt of occupationOptions; track opt.id) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div class="adv-field">
        <label>Height</label>
        <select name="height" [(ngModel)]="filters['height']">
          <option value="Any">Any</option>
          <option value="4'10&quot; - 5'0&quot;">4'10&quot; - 5'0&quot;</option>
          <option value="5'0&quot; - 5'2&quot;">5'0&quot; - 5'2&quot;</option>
          <option value="5'2&quot; - 5'4&quot;">5'2&quot; - 5'4&quot;</option>
          <option value="5'4&quot; - 5'6&quot;">5'4&quot; - 5'6&quot;</option>
          <option value="5'6&quot; - 5'8&quot;">5'6&quot; - 5'8&quot;</option>
          <option value="5'8&quot; - 5'10&quot;">5'8&quot; - 5'10&quot;</option>
          <option value="5'10&quot; - 6'0&quot;">5'10&quot; - 6'0&quot;</option>
          <option value="6'0&quot; - 6'2&quot;">6'0&quot; - 6'2&quot;</option>
          <option value="6'2&quot;+">6'2&quot;+</option>
        </select>
      </div>
    </div>
    <div class="adv-footer">
      <button type="button" class="btn-clear" (click)="clearFilters()">Clear All</button>
      <button type="button" class="btn-apply" (click)="searchRequested.emit(searchForm)">Apply Filters</button>
    </div>
  </div>
  }
</form>
