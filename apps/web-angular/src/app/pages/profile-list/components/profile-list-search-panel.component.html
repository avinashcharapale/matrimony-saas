<form class="quick-search" #searchForm="ngForm" (ngSubmit)="searchRequested.emit(searchForm)">
  <input
    type="text"
    name="name"
    [(ngModel)]="filters['name']"
    placeholder="Enter city, state or keyword"
    maxlength="60"
    pattern="[A-Za-z .-]*"
  />
  <select name="lookingForQuick" [(ngModel)]="filters['lookingFor']">
    <option>Bride</option>
    <option>Groom</option>
  </select>
  <input type="text" name="location" [(ngModel)]="filters['location']" placeholder="City" maxlength="60" pattern="[A-Za-z .-]*" />
  <select name="ageMin" [(ngModel)]="filters['ageMin']">
    <option [ngValue]="20">20</option>
    <option [ngValue]="22">22</option>
    <option [ngValue]="24">24</option>
    <option [ngValue]="26">26</option>
    <option [ngValue]="28">28</option>
  </select>
  <select name="ageMax" [(ngModel)]="filters['ageMax']">
    <option [ngValue]="26">26</option>
    <option [ngValue]="28">28</option>
    <option [ngValue]="30">30</option>
    <option [ngValue]="32">32</option>
    <option [ngValue]="34">34</option>
  </select>
  <input type="text" name="occupation" [(ngModel)]="filters['occupation']" placeholder="Occupation" maxlength="60" pattern="[A-Za-z .-]*" />
  <button type="submit">Search</button>
</form>

@if (error) {
<p class="form-error">{{ error }}</p>
}

<section class="filter-shell">
  <div class="filter-head">
    <strong>{{ resultsCount }}</strong>
    <span>matching profiles</span>
    <label>
      Sort By
      <select name="sortBy" [ngModel]="sortBy" (ngModelChange)="sortByChange.emit($event)">
        <option value="relevance">Relevance</option>
        <option value="age-asc">Age: Low to High</option>
        <option value="age-desc">Age: High to Low</option>
      </select>
    </label>
  </div>

  <div class="filter-grid">
    <label>
      Looking For
      <select name="lookingFor" [(ngModel)]="filters['lookingFor']">
        <option>Bride</option>
        <option>Groom</option>
      </select>
    </label>
    <label>
      Religion
      <select name="religion" [(ngModel)]="filters['religion']">
        <option value="">Any</option>
        @for (opt of religionOptions; track opt.valueCode) {
          <option [value]="opt.valueCode">{{ opt.label }}</option>
        }
      </select>
    </label>
    <label>
      Height
      <select name="height" [(ngModel)]="filters['height']">
        <option>5'0\" - 5'4\"</option>
        <option>5'4\" - 5'8\"</option>
        <option>5'8\" - 6'0\"</option>
      </select>
    </label>
    <label>
      Education
      <select name="education" [(ngModel)]="filters['education']">
        <option value="">Any</option>
        <option value="Graduate">Graduate</option>
        <option value="Post Graduate">Post Graduate</option>
        <option value="Doctorate">Doctorate</option>
      </select>
    </label>
    <label>
      Caste
      <select name="caste" [(ngModel)]="filters['caste']">
        <option value="">Any</option>
        @for (opt of casteOptions; track opt.valueCode) {
          <option [value]="opt.valueCode">{{ opt.label }}</option>
        }
      </select>
    </label>
    <label>
      Marital Status
      <select name="maritalStatus" [(ngModel)]="filters['maritalStatus']">
        <option value="">Any</option>
        <option value="Unmarried">Unmarried</option>
        <option value="Divorced">Divorced</option>
        <option value="Widowed">Widowed</option>
      </select>
    </label>
    <label>
      Occupation
      <input type="text" name="occupationFilter" [(ngModel)]="filters['occupation']" placeholder="Any" maxlength="60" pattern="[A-Za-z .-]*" />
    </label>
    <label>
      Horoscope Match %
      <input type="range" name="horoscope" [(ngModel)]="filters['horoscope']" min="40" max="100" />
    </label>
  </div>

  <div class="filter-actions">
    <button type="button" (click)="searchRequested.emit(searchForm)">Search Matches</button>
  </div>
</section>
