<aside class="dashboard-sidebar">
  <div class="sidebar-brand">
    <img
      class="brand-photo"
      [src]="userPhotoUrl || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iOTAiIGhlaWdodD0iOTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjkwIiBoZWlnaHQ9IjkwIiBmaWxsPSIjZjBmMGYwIi8+PHRleHQgeD0iNDUiIHk9IjUwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkeT0iLjNlbSIgZm9udC1zaXplPSI0MCIgZmlsbD0iI2MwYzBjMCI+8J+UkDwvdGV4dD48L3N2Zz4='"
      [alt]="userName"
      loading="lazy"
      referrerpolicy="no-referrer"
    />
    <div>
      <span class="brand-label">{{ userName || 'Loading...' }}</span>
      <p>{{ userOccupation || '' }}</p>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><span class="nav-icon" aria-hidden="true">⌂</span><span>Dashboard</span></a>
    <a routerLink="/my-profile" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">&#x1F464;</span><span>My Profile</span></a>
    <a routerLink="/profiles" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">⌕</span><span>Search Matches</span></a>
    <a routerLink="/interests" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">♡</span><span>Interests</span></a>
    <a routerLink="/messages" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">✉</span><span>Messages</span></a>
    <a routerLink="/events" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">☷</span><span>Events &amp; Meets</span></a>
    <a routerLink="/gallery" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">▣</span><span>Photo Gallery</span></a>
    <a routerLink="/settings" routerLinkActive="active"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></a>
    <button type="button" class="sidebar-logout" (click)="logout()"><span class="nav-icon" aria-hidden="true">↪</span><span>Logout</span></button>
  </nav>
</aside>
