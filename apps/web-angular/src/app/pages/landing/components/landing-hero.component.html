<section class="hero">
  <div class="hero-copy">
    @if (eyebrow) {
      <p class="eyebrow">{{ eyebrow }}</p>
    }
    <h1>{{ heroTitle || tenantDisplayName }}</h1>
    @if (heroSubtitle) {
      <p class="hero-subtitle">{{ heroSubtitle }}</p>
    }
    @if (heroDescription) {
      <p class="hero-description">{{ heroDescription }}</p>
    }
    <div class="hero-actions">
      <a routerLink="/register" class="btn btn-primary">{{ ctaEnroll }}</a>
      <a routerLink="/profiles" class="btn btn-muted">Browse Profiles</a>
    </div>
  </div>

  <aside class="hero-visual">
    <div class="hero-panel">
      <div class="hero-emoji">👩‍❤️‍👨</div>
    </div>
    @for (badge of badges; track badge.text) {
      <div class="float-badge">{{ badge.text }}</div>
    }
  </aside>
</section>
