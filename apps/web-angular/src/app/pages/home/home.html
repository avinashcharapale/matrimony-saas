<main class="dashboard-page">
  <div class="dashboard-shell">
    <app-home-sidebar
      [brandMark]="brandMark"
      [tenantDisplayName]="tenant.displayName"
      [subscriptionStatus]="subscriptionStatus()"
      [subscriptionLoading]="subscriptionLoading()">
    </app-home-sidebar>

    <section class="dashboard-main">
      <app-home-header [userName]="userFirstName()" [currentDate]="currentDate()"></app-home-header>
      @if (quickStats().length > 0) {
        <app-home-stats [stats]="quickStats()"></app-home-stats>
      }
      <app-home-content [topMatches]="topMatches()" [interests]="interests()" [activities]="activities()" [shortlists]="recentlyShortlisted()"></app-home-content>
      <app-home-bottom [horoscopeTags]="horoscopeTags()" [messages]="messages()"></app-home-bottom>
    </section>
  </div>
</main>
