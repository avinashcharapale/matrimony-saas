<main class="dashboard-page">
  <div class="dashboard-shell">
    <app-home-sidebar [brandMark]="brandMark" [tenantDisplayName]="tenant.displayName"></app-home-sidebar>

    <section class="dashboard-main">
      <app-home-header></app-home-header>
      <app-home-stats [stats]="quickStats"></app-home-stats>
      <app-home-content [topMatches]="topMatches" [interests]="interests" [activities]="activities"></app-home-content>
      <app-home-bottom [horoscopeTags]="horoscopeTags" [messages]="messages" [upcomingEvents]="upcomingEvents"></app-home-bottom>
    </section>
  </div>
</main>
