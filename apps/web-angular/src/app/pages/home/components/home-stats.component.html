<section class="stats-grid">
  @for (card of stats; track card.label) {
  <article class="stat-card" [class]="'stat-card ' + card.tone">
    <div class="stat-icon">{{ card.icon }}</div>
    <div class="stat-info">
      <h2>{{ card.value }}</h2>
      <p>{{ card.label }}</p>
      <span>{{ card.hint }}</span>
    </div>
  </article>
  }
</section>
