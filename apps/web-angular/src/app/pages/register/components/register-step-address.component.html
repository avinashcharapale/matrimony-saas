<section>
  <h2>Address</h2>
  <div class="field-grid">
    <div class="form-field">
      <label for="idProofNumber">PAN / Aadhar / Driving License / Passport No.</label>
      <input type="text" id="idProofNumber" name="idProofNumber" [(ngModel)]="vm.idProofNumber" />
    </div>

    <div class="form-field">
      <label for="residenceAddress">Residence Address With City</label>
      <textarea id="residenceAddress" name="residenceAddress" [(ngModel)]="vm.residenceAddress" rows="3" required minlength="10" maxlength="250"></textarea>
    </div>

    <div class="form-field">
      <label for="contactEmail"><span class="required">*</span>Email id (It's important)</label>
      <input type="email" id="contactEmail" name="contactEmail" [(ngModel)]="vm.contactEmail" required maxlength="120" />
    </div>

    <div class="form-field">
      <label for="smsMobile"><span class="required">*</span>Mobile For SMS Alert (It's important)</label>
      <input type="tel" id="smsMobile" name="smsMobile" [(ngModel)]="vm.smsMobile" (input)="sanitizePhoneInput('smsMobile')" required inputmode="numeric" maxlength="16" />
    </div>

    <div class="form-field">
      <label for="mobile2">Mobile II</label>
      <input type="tel" id="mobile2" name="mobile2" [(ngModel)]="vm.mobile2" (input)="sanitizePhoneInput('mobile2')" inputmode="numeric" maxlength="16" />
    </div>

    <div class="form-field">
      <label for="phone1">Phone I</label>
      <input type="tel" id="phone1" name="phone1" [(ngModel)]="vm.phone1" (input)="sanitizePhoneInput('phone1')" inputmode="numeric" maxlength="16" />
    </div>

    <div class="form-field">
      <label for="phone2">Phone II</label>
      <input type="tel" id="phone2" name="phone2" [(ngModel)]="vm.phone2" (input)="sanitizePhoneInput('phone2')" inputmode="numeric" maxlength="16" />
    </div>
  </div>
</section>
