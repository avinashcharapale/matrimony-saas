<section>
  <h2>Educational / Professional Details</h2>
  <div class="field-grid compact">
    <div class="form-field">
      <label for="educationArea">Education Area (It's important)</label>
      <select id="educationArea" name="educationArea" required
              [ngModel]="findIdByVmValue(educationAreaOptions, vm.educationArea)"
              (ngModelChange)="onOptionChange(educationAreaOptions, $event, 'educationArea')">
        <option value="">Select</option>
        @for (opt of educationAreaOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="education">Education</label>
      <select id="education" name="education" required
              [ngModel]="findIdByVmValue(educationOptions, vm.education)"
              (ngModelChange)="onOptionChange(educationOptions, $event, 'education')">
        <option value="">Select</option>
        @for (opt of educationOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="occupationType">Occupation Type (It's important)</label>
      <select id="occupationType" name="occupationType" required
              [ngModel]="findIdByVmValue(occupationTypeOptions, vm.occupationType)"
              (ngModelChange)="onOptionChange(occupationTypeOptions, $event, 'occupationType')">
        <option value="">Select</option>
        @for (opt of occupationTypeOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="occupationDetails">Occupation Details</label>
      <input type="text" id="occupationDetails" name="occupationDetails" [(ngModel)]="vm.occupationDetails" required maxlength="120" />
    </div>

    <div class="form-field">
      <label for="workingState">Working State / Country</label>
      <select id="workingState" name="workingState"
              [(ngModel)]="workingStateId"
              (ngModelChange)="onWorkingStateChange($event)">
        <option [ngValue]="null">Select State</option>
        @for (s of workingStates; track s.stateId) {
          <option [ngValue]="s.stateId">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="workingCityCountry">Working City / District</label>
      <select id="workingCityCountry" name="workingCityCountry"
              [(ngModel)]="vm.workingCityCountry" required
              [disabled]="workingDistricts.length === 0">
        <option value="">Select District</option>
        @for (d of workingDistricts; track d.districtId) {
          <option [value]="d.name">{{ d.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="incomeAmount">Income Amount</label>
      <input type="text" id="incomeAmount" name="incomeAmount" [(ngModel)]="vm.incomeAmount" pattern="[0-9.]*" maxlength="12" />
    </div>

    <div class="form-field">
      <label for="incomePeriod">Income Period</label>
      <select id="incomePeriod" name="incomePeriod"
              [ngModel]="findIdByVmValue(incomePeriodOptions, vm.incomePeriod)"
              (ngModelChange)="onOptionChange(incomePeriodOptions, $event, 'incomePeriod')">
        <option value="">Select</option>
        @for (opt of incomePeriodOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>
  </div>
</section>
