<section>
  <h2>Educational / Professional Details</h2>
  <div class="field-grid compact" [formGroup]="career">
    <div class="form-field">
      <label>Education Area (It's important)</label>
      <select formControlName="educationAreaId">
        <option [ngValue]="null">Select</option>
        @for (opt of educationAreaOptions; track opt.id) { <option [ngValue]="opt.id">{{ opt.label }}</option> }
      </select>
    </div>
    <div class="form-field">
      <label>Education</label>
      <select formControlName="educationId">
        <option [ngValue]="null">Select</option>
        @for (opt of educationOptions; track opt.id) { <option [ngValue]="opt.id">{{ opt.label }}</option> }
      </select>
    </div>
    <div class="form-field">
      <label>Occupation Type (It's important)</label>
      <select formControlName="occupationId">
        <option [ngValue]="null">Select</option>
        @for (opt of occupationTypeOptions; track opt.id) { <option [ngValue]="opt.id">{{ opt.label }}</option> }
      </select>
    </div>
    <div class="form-field">
      <label>Occupation Details</label>
      <input type="text" formControlName="occupationDetails" maxlength="120" />
    </div>
    <div class="form-field">
      <label>Working Country</label>
      <select formControlName="workingCountryId">
        <option [ngValue]="null">Select Country</option>
        @for (c of countryOptions; track c.countryId) { <option [ngValue]="c.countryId">{{ c.name }}</option> }
        <option [ngValue]="0">Other</option>
      </select>
    </div>
    @if (isWorkingCountryOther) {
      <div class="form-field">
        <label>Working Country (Other)</label>
        <input type="text" formControlName="workingCountryOther" placeholder="Enter country name" maxlength="100" />
      </div>
    }
    @if (career.get('workingCountryId')?.value && career.get('workingCountryId')?.value !== 0) {
      <div class="form-field">
        <label>Working State</label>
        <select formControlName="workingStateId">
          <option [ngValue]="null">Select State</option>
          @for (s of workingStates; track s.stateId) { <option [ngValue]="s.stateId">{{ s.name }}</option> }
          <option [ngValue]="0">Other</option>
        </select>
      </div>
      @if (isWorkingStateOther) {
        <div class="form-field">
          <label>Working State (Other)</label>
          <input type="text" formControlName="workingStateOther" placeholder="Enter state name" maxlength="100" />
        </div>
        <div class="form-field">
          <label>Working City (Other)</label>
          <input type="text" formControlName="workingCity" placeholder="Enter city name" maxlength="120" />
        </div>
      }
      @if (!isWorkingStateOther && career.get('workingStateId')?.value) {
        <div class="form-field">
          <label>Working City / District</label>
          <select formControlName="workingCity" [disabled]="workingDistricts.length === 0">
            <option value="">Select District</option>
            @for (d of workingDistricts; track d.districtId) { <option [value]="d.name!">{{ d.name }}</option> }
            <option value="__other__">Other</option>
          </select>
        </div>
        @if (isWorkingCityOther) {
          <div class="form-field">
            <label>Working City (Other)</label>
            <input type="text" formControlName="workingCityOther" placeholder="Enter city name" maxlength="120" />
          </div>
        }
      }
    }
    <div class="form-field">
      <label>Income Amount</label>
      <input type="number" formControlName="incomeAmount" maxlength="12" min="0" />
    </div>
    <div class="form-field">
      <label>Income Period</label>
      <select formControlName="incomePeriodId">
        <option [ngValue]="null">Select</option>
        @for (opt of incomePeriodOptions; track opt.id) { <option [ngValue]="opt.id">{{ opt.label }}</option> }
      </select>
    </div>
  </div>
</section>
