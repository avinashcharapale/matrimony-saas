<section>
  <h2>Horoscope Details</h2>
  <div class="field-grid compact">
    <div class="form-field">
      <label for="rashi">Rashi</label>
      <select id="rashi" name="rashi"
              [ngModel]="findIdByVmValue(rashiOptions, vm.rashi)"
              (ngModelChange)="onOptionChange(rashiOptions, $event, 'rashi')">
        <option value="">Unspecified</option>
        @for (opt of rashiOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="nakshatra">Nakshatra</label>
      <select id="nakshatra" name="nakshatra"
              [ngModel]="findIdByVmValue(nakshatraOptions, vm.nakshatra)"
              (ngModelChange)="onOptionChange(nakshatraOptions, $event, 'nakshatra')">
        <option value="">Unspecified</option>
        @for (opt of nakshatraOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="charan">Charan</label>
      <select id="charan" name="charan"
              [ngModel]="findIdByVmValue(charanOptions, vm.charan)"
              (ngModelChange)="onOptionChange(charanOptions, $event, 'charan')">
        <option value="">Unspecified</option>
        @for (opt of charanOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="nadi">Nadi</label>
      <select id="nadi" name="nadi"
              [ngModel]="findIdByVmValue(nadiOptions, vm.nadi)"
              (ngModelChange)="onOptionChange(nadiOptions, $event, 'nadi')">
        <option value="">Unspecified</option>
        @for (opt of nadiOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="gan">Gan</label>
      <select id="gan" name="gan"
              [ngModel]="findIdByVmValue(ganOptions, vm.gan)"
              (ngModelChange)="onOptionChange(ganOptions, $event, 'gan')">
        <option value="">Unspecified</option>
        @for (opt of ganOptions; track opt.id) {
          <option [ngValue]="opt.id">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="manglik">Mangal</label>
      <select id="manglik" name="manglik" [(ngModel)]="vm.manglik">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
    </div>

    <div class="form-field">
      <label for="birthHour">Birth Time (It's important)</label>
      <div class="time-group">
        <select id="birthHour" name="birthHour" [(ngModel)]="vm.birthHour">
          @for (h of ['01','02','03','04','05','06','07','08','09','10','11','12']; track h) { <option [value]="h">{{ h }}</option> }
        </select>
        <select name="birthMinute" [(ngModel)]="vm.birthMinute">
          @for (m of ['00','05','10','15','20','25','30','35','40','45','50','55']; track m) { <option [value]="m">{{ m }}</option> }
        </select>
        <select name="birthPeriod" [(ngModel)]="vm.birthPeriod" required>
          <option value="Select">Select</option>
          <option value="AM">AM</option>
          <option value="PM">PM</option>
        </select>
      </div>
    </div>

    <div class="form-field">
      <label for="birthState">Birth State</label>
      <select id="birthState" name="birthState"
              [(ngModel)]="birthStateId"
              (ngModelChange)="onBirthStateChange($event)">
        <option [ngValue]="null">Select State</option>
        @for (s of birthStates; track s.stateId) {
          <option [ngValue]="s.stateId">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="birthDistrict">Birth District</label>
      <select id="birthDistrict" name="birthDistrict"
              [(ngModel)]="vm.birthDistrict" required
              [disabled]="birthDistricts.length === 0">
        <option value="">Select District</option>
        @for (d of birthDistricts; track d.districtId) {
          <option [value]="d.name">{{ d.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="devak">Devak</label>
      <input type="text" id="devak" name="devak" [(ngModel)]="vm.devak" />
    </div>
  </div>
</section>
