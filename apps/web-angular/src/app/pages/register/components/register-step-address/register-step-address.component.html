<section>
  <h2>Address</h2>
  <div class="field-grid" [formGroup]="contact">
    <div class="form-field">
      <label>PAN / Aadhar / Driving License / Passport No.</label>
      <input type="text" formControlName="idProofNumber" />
    </div>
    <div class="form-field">
      <label>Residence Address With City</label>
      <textarea formControlName="residenceAddress" rows="3" maxlength="250"></textarea>
    </div>
    <div class="form-field">
      <label><span class="required">*</span>Email id (It's important)</label>
      <input type="email" formControlName="contactEmail" maxlength="120" />
    </div>
    <div class="form-field">
      <label><span class="required">*</span>Mobile For SMS Alert (It's important)</label>
      <input type="tel" formControlName="smsMobile" inputmode="numeric" maxlength="16" />
    </div>
    <div class="form-field">
      <label>Mobile II</label>
      <input type="tel" formControlName="mobile2" inputmode="numeric" maxlength="16" />
    </div>
    <div class="form-field">
      <label>Phone I</label>
      <input type="tel" formControlName="phone1" inputmode="numeric" maxlength="16" />
    </div>
    <div class="form-field">
      <label>Phone II</label>
      <input type="tel" formControlName="phone2" inputmode="numeric" maxlength="16" />
    </div>
  </div>
</section>
