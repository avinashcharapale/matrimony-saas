<section>
  <h2>Family Background</h2>
  <div class="field-grid">
    <div class="form-field">
      <label for="fatherStatus">Father</label>
      <select id="fatherStatus" name="fatherStatus" [(ngModel)]="vm.fatherStatus">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="form-field">
      <label for="motherStatus">Mother</label>
      <select id="motherStatus" name="motherStatus" [(ngModel)]="vm.motherStatus">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
    </div>

    <div class="form-field">
      <label for="brothers">Brothers</label>
      <select id="brothers" name="brothers" [(ngModel)]="vm.brothers">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="form-field">
      <label for="marriedBrothers">Married Brothers</label>
      <select id="marriedBrothers" name="marriedBrothers" [(ngModel)]="vm.marriedBrothers">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="form-field">
      <label for="sisters">Sisters</label>
      <select id="sisters" name="sisters" [(ngModel)]="vm.sisters">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="form-field">
      <label for="marriedSisters">Married Sisters</label>
      <select id="marriedSisters" name="marriedSisters" [(ngModel)]="vm.marriedSisters">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>

    <div class="form-field">
      <label for="parentsFullName">Parents Fullname</label>
      <input type="text" id="parentsFullName" name="parentsFullName" [(ngModel)]="vm.parentsFullName" required maxlength="120" />
    </div>

    <div class="form-field">
      <label for="parentsOccupation">Parents Occupation</label>
      <input type="text" id="parentsOccupation" name="parentsOccupation" [(ngModel)]="vm.parentsOccupation" />
    </div>

    <div class="form-field">
      <label for="parentsResidentCity">Parents Resident City</label>
      <input type="text" id="parentsResidentCity" name="parentsResidentCity" [(ngModel)]="vm.parentsResidentCity" />
    </div>

    <div class="form-field">
      <label for="relativesSurnames">Surnames of Relatives</label>
      <textarea id="relativesSurnames" name="relativesSurnames" [(ngModel)]="vm.relativesSurnames" rows="3"></textarea>
    </div>

    <div class="form-field">
      <label for="familyWealth">Family Wealth (e.g. Flat, Agri land, etc)</label>
      <input type="text" id="familyWealth" name="familyWealth" [(ngModel)]="vm.familyWealth" />
    </div>

    <div class="form-field">
      <label for="mamaSurnamePlace">Mama's Surname / Place</label>
      <input type="text" id="mamaSurnamePlace" name="mamaSurnamePlace" [(ngModel)]="vm.mamaSurnamePlace" />
    </div>

    <div class="form-field">
      <label for="nativeState">Native State</label>
      <select id="nativeState" name="nativeState"
              [(ngModel)]="nativeStateId"
              (ngModelChange)="onNativeStateChange($event)">
        <option [ngValue]="null">Select State</option>
        @for (s of nativeStates; track s.stateId) {
          <option [ngValue]="s.stateId">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="nativeDistrict"><span class="required">*</span>Native District (It's important)</label>
      <select id="nativeDistrict" name="nativeDistrict"
              [(ngModel)]="nativeDistrictId"
              (ngModelChange)="onNativeDistrictChange($event)"
              required
              [disabled]="nativeDistricts.length === 0">
        <option [ngValue]="null">Select District</option>
        @for (d of nativeDistricts; track d.districtId) {
          <option [ngValue]="d.districtId">{{ d.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="nativeTaluka">Native Taluka, If Any</label>
      <select id="nativeTaluka" name="nativeTaluka"
              [(ngModel)]="vm.nativeTaluka"
              [disabled]="nativeTalukas.length === 0">
        <option value="">Select Taluka</option>
        @for (t of nativeTalukas; track t.talukaId) {
          <option [value]="t.name">{{ t.name }}</option>
        }
      </select>
    </div>

    <div class="form-field">
      <label for="intercastMarriage">Any Intercaste Marriage In Core Family</label>
      <select id="intercastMarriage" name="intercastMarriage" [(ngModel)]="vm.intercastMarriage">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
      </select>
    </div>

    <div class="form-field">
      <label for="intercastRelation">If yes (Relation/Caste)</label>
      <textarea id="intercastRelation" name="intercastRelation" [(ngModel)]="vm.intercastRelation" rows="3"></textarea>
    </div>
  </div>
</section>
