<div class="tpl-root">
  <app-loader></app-loader>
  @if (!isLanding()) {
  <div class="nav-spacer"></div>
  <app-tpl-nav
    [brandLetter]="brandLetter()"
    [brandName]="brandName()"
    [logoUrl]="tenant.logoUrl"
    [navDark]="templateNavDark()"
    [ctaLogin]="tenant.ctaLogin"
    [ctaEnroll]="tenant.ctaEnroll"
    [btnClass]="templateBtnClass()"
    [tplId]="templateId()"
    [isLoggedIn]="isLoggedIn()"
    [style]="navStyle()"
    (logout)="logout()"
  ></app-tpl-nav>
  }

  @if (isLoggedIn()) {
    <div class="sidebar-backdrop" [class.visible]="sidebarOpen()" (click)="closeMobileMenu()"></div>
  }

  <main class="app-content" [class.landing]="isLanding()">
    <router-outlet></router-outlet>
  </main>
</div>
